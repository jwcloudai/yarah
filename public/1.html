<!DOCTYPE html>
<html>
<head>
    <title>Jotform Direct Test</title>
</head>
<body>

<h2>Jotform Direct Submit Test</h2>

<form action="https://submit.jotform.com/submit/261582875886073" method="post">

    <input
        type="text"
        name="q3_name[first]"
        placeholder="First Name"
        required
    />

    <br><br>

    <input
        type="text"
        name="q3_name[last]"
        placeholder="Last Name"
        required
    />

    <br><br>

    <input
        type="email"
        name="q4_email"
        placeholder="Email"
        required
    />

    <br><br>

    <button type="submit">
        Submit
    </button>

</form>

</body>
</html>
